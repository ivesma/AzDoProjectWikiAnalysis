[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-devops-wiki-indexer"
dynamic = ["version"]
description = "Crawl, index, search and export Azure DevOps project wikis."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PySide6>=6.9",
    "requests>=2.32",
    "keyring>=25.0",
    "nltk>=3.9",
    "rapidfuzz>=3.9",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
spacy = ["spacy>=3.7"]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-qt>=4.4", "responses>=0.25", "pillow>=10", "pyinstaller>=6.6"]

[project.scripts]
wiki-indexer-cli = "wiki_indexer.cli:main"

[project.gui-scripts]
wiki-indexer = "wiki_indexer.app:main"

[tool.setuptools.dynamic]
version = { attr = "wiki_indexer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
addopts = "-ra"

[tool.coverage.run]
source = ["wiki_indexer"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
